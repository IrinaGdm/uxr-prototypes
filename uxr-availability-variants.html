<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UXR – Availability screen variants</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    background: #e8e5df;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  figure { max-width: 1400px; width: 100%; margin: 0 auto; }
  img {
    max-width: 100%;
    height: auto;
    display: block;
    margin: 0 auto;
    border-radius: 8px;
    box-shadow: 0 4px 24px rgba(0,0,0,.10);
  }
</style>
</head>
<body>
<figure>
  <img src="variants.png"
       alt="Three variants of the 'When do you prefer to talk to pros?' availability screen shown side by side.">
</figure>
</body>
</html>
